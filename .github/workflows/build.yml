name: Build and publish

on:
  push:
    branches: [main]
    paths:
      - "src/*"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Read version from manifest
        id: version
        run: echo "version=$(jq -r .version manifest.json)" >> "$GITHUB_OUTPUT"

      - name: Push to build branch
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stash build artefacts (main.js is gitignored, so we must copy it manually)
          mkdir -p /tmp/build-artefacts
          cp main.js manifest.json styles.css /tmp/build-artefacts/

          # Switch to build branch (create orphan if it doesn't exist)
          git fetch origin build || true
          if git rev-parse --verify origin/build >/dev/null 2>&1; then
            git checkout -f build
          else
            git checkout --orphan build
            git rm -rf .
          fi

          # Restore artefacts
          cp /tmp/build-artefacts/* .

          git add main.js manifest.json styles.css
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "v${VERSION} (${GITHUB_SHA::8})"
            git push origin build
          fi

      - name: Create release archive
        run: |
          mkdir -p /tmp/release
          cp /tmp/build-artefacts/* /tmp/release/
          cd /tmp/release
          zip elf-${{ steps.version.outputs.version }}.zip main.js manifest.json styles.css

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: /tmp/release/elf-${{ steps.version.outputs.version }}.zip
          make_latest: true
