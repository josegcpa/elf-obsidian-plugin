name: Build and publish

on:
  push:
    branches: [main]
    paths:
      - "src/*"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Push to build branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stash build artefacts (main.js is gitignored, so we must copy it manually)
          mkdir -p /tmp/build-artefacts
          cp main.js manifest.json styles.css /tmp/build-artefacts/

          # Switch to build branch (create orphan if it doesn't exist)
          git fetch origin build || true
          if git rev-parse --verify origin/build >/dev/null 2>&1; then
            git checkout -f build
          else
            git checkout --orphan build
            git rm -rf .
          fi

          # Restore artefacts
          cp /tmp/build-artefacts/* .

          git add main.js manifest.json styles.css
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Build from ${GITHUB_SHA::8}"
            git push origin build
          fi
